[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-capability-catalog"
version = "0.1.0"
description = "Federated capability index (concept/indicator/graph/dataset) over the fd-ontology-kernel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fd-ontology-kernel"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["fd_capability_catalog"]
